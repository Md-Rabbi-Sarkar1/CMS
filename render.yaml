# Render blueprint for the Docker-based production deployment.

services:
  - type: web
    name: construction-ops-api
    plan: free
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: construction-ops-db
          property: connectionString
      # CORS origin: the public web origin, e.g. https://construction-ops-web.onrender.com
      - key: WEB_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  - type: web
    name: construction-ops-web
    plan: free
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      # Browser traffic uses the same-origin Next.js proxy so auth cookies
      # remain available to both browser navigation and server rendering.
      - key: NEXT_PUBLIC_API_URL
        value: /api/proxy/api/v1
      - key: API_ORIGIN
        value: https://construction-ops-api.onrender.com
      - key: API_INTERNAL_URL
        value: https://construction-ops-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_ENABLE_DEMO_LOGIN
        value: "true"

databases:
  - name: construction-ops-db
    plan: free
    databaseName: construction_ops
    user: construction_ops

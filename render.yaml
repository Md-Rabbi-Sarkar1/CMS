# Phase 22 — Render blueprint (see docs/DEPLOYMENT.md for the full runbook).
#
# The repository documentation only specifies "cloud hosting", so this
# blueprint is one minimal expression of the documented architecture. It
# renders the same two services from Phase 20 (api + web + database) using
# platform-native Node builds; any Docker-capable host can instead deploy the
# Phase 20 images directly (render.yaml is optional, the app is not tied to it).

services:
  - type: web
    name: construction-ops-api
    plan: free
    runtime: node
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm -w build:packages &&
      pnpm --filter @construction-ops/api build
    startCommand: node apps/api/dist/index.js
    # Migrations run before every deploy; `migrate deploy` is the
    # production-safe Prisma command (never `migrate dev` or `db push`).
    preDeployCommand: >-
      pnpm --filter @construction-ops/database exec prisma migrate deploy &&
      pnpm --filter @construction-ops/database exec prisma db seed
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: construction-ops-db
          property: connectionString
      # CORS origin: the public web origin, e.g. https://construction-ops-web.onrender.com
      - key: WEB_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  - type: web
    name: construction-ops-web
    plan: free
    runtime: node
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm --filter @construction-ops/shared --filter @construction-ops/validation build &&
      pnpm --filter @construction-ops/web build
    startCommand: pnpm --filter @construction-ops/web start
    envVars:
      - key: NODE_ENV
        value: production
      # Inlined into the browser bundle at build time; set it once in the
      # Render dashboard to the public API origin
      # (e.g. https://construction-ops-api.onrender.com/api/v1).
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_ENABLE_DEMO_LOGIN
        value: "true"

databases:
  - name: construction-ops-db
    plan: free
    databaseName: construction_ops
    user: construction_ops
